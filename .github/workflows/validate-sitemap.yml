name: Validate Sitemap URLs
on:
  workflow_run:
    workflows: ['Deploy Frontend to Hostinger']
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
jobs:
  validate:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/validate-sitemap.sh
      - name: Check API readiness
        run: curl -fLsS --connect-timeout 5 --max-time 20 --max-redirs 5 https://app.stayhustler.com/ready
