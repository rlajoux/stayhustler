name: Deploy Frontend to Hostinger
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['public/**', 'scripts/**', '.github/workflows/**']
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write public build revision
        env:
          BUILD_REVISION: ${{ github.sha }}
        run: node -e 'require("fs").writeFileSync("public/build-info.json", JSON.stringify({revision:process.env.BUILD_REVISION}))'
      - name: Configure SSH using pinned host keys
        env:
          DEPLOY_SSH_KEY: ${{ secrets.SSH }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy canonical static folder
        run: >-
          rsync -avz --delete
          -e 'ssh -p 65002 -o StrictHostKeyChecking=yes -o ConnectTimeout=30'
          public/ u837303424@145.79.4.36:/home/u837303424/domains/stayhustler.com/public_html/
